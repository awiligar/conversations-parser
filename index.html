<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="https://awiligar.github.io/conversations-parser/favicon.svg" />
    <meta name="description" content="Parse conversations exported from LLMs and cherry-pick JSON fields to create the desired output JSON." />
    <meta name="keywords" content="LLM conversations, conversation parser, JSON, cherry-pick, data extraction" />
    <title>Conversation Parser</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Conversation Parser" />
    <meta property="og:description" content="Parse conversations exported from LLMs and cherry-pick JSON fields to create the desired output JSON." />
    <meta property="og:image" content="https://awiligar.github.io/conversations-parser/og-image.jpg" />
    <meta property="og:url" content="https://awiligar.github.io/conversations-parser/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Conversation Parser" />
    <meta name="twitter:description" content="Parse conversations exported from LLMs and cherry-pick JSON fields to create the desired output JSON." />
    <meta name="twitter:image" content="https://awiligar.github.io/conversations-parser/og-image.jpg" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto flex min-h-screen w-full flex-col gap-6 p-6">
      <header>
        <h1 class="text-3xl font-bold">Conversation Parser</h1>
        <p class="mt-2 text-base-content/70">Select a JSON file to view its formatted contents.</p>
      </header>

      <section class="card flex-1 bg-base-100 shadow-sm">
        <div class="card-body flex min-h-0 gap-4">
          <input id="file-input" class="hidden" type="file" accept="application/json,.json" />
          <label for="file-input" class="btn w-fit">Select JSON file</label>
          <p id="file-name" class="text-sm text-base-content/60" aria-live="polite">No file selected</p>

          <div class="flex items-center justify-between gap-4">
            <label for="json-output" class="label">
              <span class="label-text font-semibold">JSON output</span>
            </label>
            <button id="copy-button" class="btn btn-sm" type="button">Copy output</button>
          </div>
          <textarea
            id="json-output"
            class="textarea textarea-bordered min-h-72 w-full flex-1 resize-none font-mono text-sm"
            readonly
            placeholder="Your formatted JSON will appear here..."
          ></textarea>
          <p id="copy-status" class="text-sm text-base-content/60" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
